act@v4name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/oyunceviri/tv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:allowBackup="true" android:label="OyunÇeviri TV" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#121212" android:gravity="center" android:orientation="vertical" android:padding="32dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="OyunÇeviri v5.1 TV Alıcısı" android:textColor="#00e676" android:textSize="28sp" android:textStyle="bold" />
              <EditText android:id="@+id/etServerIp" android:layout_width="450dp" android:layout_height="55dp" android:layout_marginTop="24dp" android:background="#2c2c2c" android:gravity="center" android:hint="PC IP ve Port (Örn: 192.168.1.107:8080)" android:textColor="#ffffff" android:textColorHint="#777777" android:textSize="16sp" />
              <Button android:id="@+id/btnConnect" android:layout_width="450dp" android:layout_height="55dp" android:layout_marginTop="16dp" android:backgroundTint="#0288d1" android:text="TV BAĞLANTISINI BAŞLAT" android:textColor="#ffffff" android:textSize="16sp" android:textStyle="bold" />
              <TextView android:id="@+id/tvStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="20dp" android:text="Durum: Bekleniyor..." android:textColor="#ffeb3b" android:textSize="18sp" />
          </LinearLayout>
          EOF

          # overlay_subtitle.xml
          cat << 'EOF' > app/src/main/res/layout/overlay_subtitle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:background="#AA000000" android:gravity="center" android:padding="12dp">
              <TextView android:id="@+id/subtitleText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:gravity="center" android:text="Altyazı Bekleniyor..." android:textColor="#ffeb3b" android:textSize="26sp" android:textStyle="bold" />
          </LinearLayout>
          EOF

          # build.gradle (app)
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.oyunceviri.tv'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.oyunceviri.tv'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'org.java-websocket:Java-WebSocket:1.5.3'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "OyunCeviriTV"
          include ':app'
          EOF

          # build.gradle (project)
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/oyunceviri/tv/MainActivity.kt
          package com.oyunceviri.tv
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import org.java_websocket.client.WebSocketClient
          import org.java_websocket.handshake.ServerHandshake
          import org.json.JSONObject
          import java.net.URI

          class MainActivity : AppCompatActivity() {
              private lateinit var etServerIp: EditText
              private lateinit var btnConnect: Button
              private lateinit var tvStatus: TextView
              private var webSocketClient: WebSocketClient? = null
              private var overlayView: View? = null
              private var tvSubtitle: TextView? = null
              private var windowManager: WindowManager? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  etServerIp = findViewById(R.id.etServerIp)
                  btnConnect = findViewById(R.id.btnConnect)
                  tvStatus = findViewById(R.id.tvStatus)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      startActivityForResult(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")), 1234)
                  } else { setupOverlayView() }
                  btnConnect.setOnClickListener {
                      val ipPort = etServerIp.text.toString().trim()
                      if (ipPort.isNotEmpty()) {
                          try {
                              webSocketClient?.close()
                              webSocketClient = object : WebSocketClient(URI("ws://$ipPort")) {
                                  override fun onOpen(h: ServerHandshake?) { runOnUiThread { tvStatus.text = "Durum: Bağlandı!"; tvStatus.setTextColor(-16711936) } }
                                  override fun onMessage(m: String?) {
                                      m?.let { runOnUiThread { showSubtitle(try { JSONObject(it).optString("tr", it) } catch(e:Exception){ it }) } }
                                  }
                                  override fun onClose(c: Int, r: String?, remote: Boolean) { runOnUiThread { tvStatus.text = "Durum: Koptu" } }
                                  override fun onError(ex: Exception?) { runOnUiThread { tvStatus.text = "Hata" } }
                              }
                              webSocketClient?.connect()
                          } catch(e:Exception){}
                      }
                  }
              }
              private fun setupOverlayView() {
                  if (overlayView != null) return
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val params = WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.WRAP_CONTENT, if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE, android.graphics.PixelFormat.TRANSLUCENT)
                  params.gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  params.y = 80
                  overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_subtitle, null)
                  tvSubtitle = overlayView?.findViewById(R.id.subtitleText)
                  try { windowManager?.addView(overlayView, params); overlayView?.visibility = View.GONE } catch(e:Exception){}
              }
              private fun showSubtitle(text: String) {
                  if (text.isBlank()) overlayView?.visibility = View.GONE else { tvSubtitle?.text = text; overlayView?.visibility = View.VISIBLE }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oyunceviri-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk

        with:
          name: oyunceviri-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
