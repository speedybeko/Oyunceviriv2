name: Build APK
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.9}
      - name: Birim testleri (core)
        run: |
          ZIP=$(ls oyun-ceviri*.zip 2>/dev/null | sort -V | tail -1)
          DIR=.
          if [ -n "$ZIP" ]; then
            echo "Zip bulundu: $ZIP"
            unzip -q "$ZIP" -d proj-test
            DIR=proj-test
          fi
          gradle :core:test -p "$DIR"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.9}
      - name: Build debug APKs
        run: |
          ZIP=$(ls oyun-ceviri*.zip 2>/dev/null | sort -V | tail -1)
          DIR=.
          if [ -n "$ZIP" ]; then
            echo "Zip bulundu: $ZIP"
            unzip -q "$ZIP" -d proj
            DIR=proj
          fi
          gradle assembleDebug -p "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: oyun-ceviri-apks
          path: "**/build/outputs/apk/debug/*.apk"
